name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build web
        working-directory: web
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund --legacy-peer-deps
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build --release --bin bili-sync-rs

      - name: Prepare runtime files
        run: |
          mkdir -p dist
          cp target/release/bili-sync-rs dist/
          cat > dist/Dockerfile <<'EOF'
          FROM alpine:3.20
          RUN apk add --no-cache ca-certificates tzdata ffmpeg
          ENV LANG=zh_CN.UTF-8 TZ=Asia/Shanghai HOME=/app RUST_BACKTRACE=1 RUST_LOG=None,bili_sync=info
          WORKDIR /app
          COPY bili-sync-rs /app/bili-sync-rs
          RUN chmod +x /app/bili-sync-rs
          VOLUME ["/app/.config/bili-sync"]
          EXPOSE 12345
          ENTRYPOINT ["/app/bili-sync-rs"]
          EOF

      - name: Compute image tags
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$GITHUB_REF_NAME" ]; then
            VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: dist
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bili-sync-rs-linux-x86_64
          path: target/release/bili-sync-rs
